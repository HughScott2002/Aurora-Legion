# https://rust-lang.github.io/rustfmt/

# The rustfmt default, chosen rather than inherited (#33). Two reasons.
# An editor with no project configuration formats to the same width the
# pre-push gate checks, so nobody fights their tools. And at 100 columns
# rustfmt wraps long expressions outward, which is the direction this
# code is written in: explicit data movement with named intermediates.
# The 200 this file carried since v0.19.3 did the opposite, collapsing
# hand-wrapped statements back onto single long lines.
max_width = 100
