name: Feature Request
description: Something Aurora should be able to do and cannot.
labels:
  - enhancement
body:
  - type: textarea
    id: description
    attributes:
      label: What you want
      description: >-
        What Aurora should do, and what you are trying to get done with it.
        The second half matters more than the first: it is what decides
        whether there is a simpler way to get you there.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: How you would do it
      description: If you have a shape in mind, describe it.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: >-
        Workarounds, other tools, or the way you do it today. A workaround
        that almost works usually says where the real gap is.
    validations:
      required: false

  - type: textarea
    id: other_details
    attributes:
      label: Anything else
      description: Mockups, links, or prior art from other tools.
    validations:
      required: false
