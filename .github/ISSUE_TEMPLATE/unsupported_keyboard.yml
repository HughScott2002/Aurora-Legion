name: Keyboard Support
description: Aurora does not find your keyboard, or says it is unsupported.
labels:
  - keyboard support
body:
  - type: markdown
    attributes:
      value: >-
        ## Read this first


        Run `aurora doctor`. It tells the three cases apart, and they need
        different fixes:


        - **No Lenovo device on the bus.** Either the model is unsupported,
        or the controller stopped answering. If the keyboard lit up earlier
        this boot, it is the second one and a reboot brings it back.

        - **The controller is there but will not open.** This is
        permissions, and it is the common one. Follow [Grant keyboard
        access](https://github.com/HughScott2002/Aurora-Legion/blob/main/docs/how-to/install-linux.md#grant-keyboard-access).

        - **The controller opens.** Then the keyboard is supported and this
        is a bug, so please file a Bug Report instead.


        Aurora drives 4 zone RGB keyboards on Lenovo Legion, IdeaPad and LOQ
        laptops. Per key models use a different controller and are not
        supported.

  - type: textarea
    id: doctor
    attributes:
      label: aurora doctor
      description: >-
        Output of `aurora doctor`. Its controller check lists every Lenovo
        device on the bus and says which of them Aurora recognises, which is
        the whole question here.
      render: shell
    validations:
      required: true

  - type: input
    id: keyboard_ids
    attributes:
      label: Keyboard IDs
      description: >-
        The vendor and product ID of the controller, as `aurora doctor` or
        `lsusb` prints it. Repeating it here makes the issue searchable for
        the next person with the same model.
      placeholder: 048d:c995
    validations:
      required: true

  - type: input
    id: laptop_model
    attributes:
      label: Laptop model and year
      placeholder: Legion 5 Pro 16ARH7H, 2022
    validations:
      required: true

  - type: checkboxes
    id: acknowledgments
    attributes:
      label: Before you file
      options:
        - label: My keyboard has 4 lighting zones, not per key lighting.
          required: true
        - label: Fn+Space cycles the keyboard's own lighting slots.
          required: false
